gin: 0; color: #7E786E; font-size: 10px\">Scenă<\u002Fp><p class=\"sf\" style=\"margin: 10px 0 0; font-size: 21px; font-weight: 500\">Locul 2 · Classic Physique, NPC 2026<\u002Fp><\u002Fdiv>\n<div style=\"padding: 24px 24px 0 0\"><p class=\"lb\" style=\"margin: 0; color: #7E786E; font-size: 10px\">Formare<\u002Fp><p class=\"sf\" style=\"margin: 10px 0 0; font-size: 21px; font-weight: 500\">Trei specializări ISSA<\u002Fp><\u002Fdiv>\n<div style=\"padding: 24px 0 0 0\"><p class=\"lb\" style=\"margin: 0; color: #7E786E; font-size: 10px\">Ritm<\u002Fp><p class=\"sf\" style=\"margin: 10px 0 0; font-size: 21px; font-weight: 500\">O decizie nouă în fiecare săptămână<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hm\" aria-hidden=\"true\" style=\"position: absolute; right: clamp(20px,4vw,56px); bottom: 24px; display: flex; flex-direction: column; align-items: center; gap: 12px\"><span class=\"lb\" style=\"font-size: 9px; color: #7E786E; writing-mode: vertical-rl\">Scroll<\u002Fspan><span style=\"width: 1px; height: 56px; background: #D2AE6D; animation: cue 2.4s cubic-bezier(.76,0,.24,1) infinite\"><\u002Fspan><\u002Fdiv>\n<\u002Fsection>\n\n<div aria-hidden=\"true\" style=\"overflow: hidden; border-top: 1px solid #1F2023; padding: clamp(24px,3vw,40px) 0\">\n<div data-mq=\"1\" class=\"sf\" style=\"display: flex; width: max-content; gap: 0.4em; white-space: nowrap; font-size: clamp(64px,10vw,168px); font-weight: 600; letter-spacing: -.03em; line-height: 1; will-change: transform\">\n<span class=\"ol\">Calculat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan><span>Ajustat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan><span class=\"ol\">Repetat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan><span class=\"ol\">Calculat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan><span>Ajustat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan><span class=\"ol\">Repetat<\u002Fspan><span style=\"color: #D2AE6D\">·<\u002Fspan>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<section id=\"metoda\" data-rv=\"man\" class=\"{{rv.man}}\" style=\"background: #EFEBE3; color: #0E0F11\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: clamp(96px,13vw,200px) clamp(20px,4vw,56px)\">\n<p class=\"lb fu\" style=\"--d: 0s; margin: 0 0 48px; color: #6B665C\">01 — Metoda<\u002Fp>\n<h2 data-words=\"1\" class=\"sf\" style=\"margin: 0; font-size: clamp(34px,4.8vw,78px); line-height: 1.08; font-weight: 500; letter-spacing: -.03em; max-width: 1180px\"><sc-for list=\"{{words}}\" as=\"w\" hint-placeholder-count=\"30\"><span data-w=\"1\" style=\"color: {{w.c}}; opacity: {{w.o}}\">{{w.t}} <\u002Fspan><\u002Fsc-for><\u002Fh2>\n<div style=\"margin-top: clamp(56px,7vw,104px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(300px,100%),1fr)); gap: 48px\">\n<div class=\"fu\" style=\"--d: .5s\"><div class=\"rl\" style=\"--d: .4s; height: 1px; background: #0E0F11; margin-bottom: 24px\"><\u002Fdiv><p class=\"sf\" style=\"margin: 0 0 12px; font-size: 26px; font-weight: 500\">Scris pe viața reală<\u002Fp><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #4A463F\">Ture, deplasări, copii, zile de 12 ore. Pornim de la agenda ta, nu de la una ideală pe care n-o vei avea niciodată.<\u002Fp><\u002Fdiv>\n<div class=\"fu\" style=\"--d: .62s\"><div class=\"rl\" style=\"--d: .52s; height: 1px; background: #0E0F11; margin-bottom: 24px\"><\u002Fdiv><p class=\"sf\" style=\"margin: 0 0 12px; font-size: 26px; font-weight: 500\">Decizii, nu presupuneri<\u002Fp><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #4A463F\">Greutate, poze, energie, kilograme pe bară. Fiecare check-in se încheie cu o corectură concretă.<\u002Fp><\u002Fdiv>\n<div class=\"fu\" style=\"--d: .74s\"><div class=\"rl\" style=\"--d: .64s; height: 1px; background: #0E0F11; margin-bottom: 24px\"><\u002Fdiv><p class=\"sf\" style=\"margin: 0 0 12px; font-size: 26px; font-weight: 500\">Verificat pe propriul corp<\u002Fp><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #4A463F\">Aceleași principii le aplic în pregătirea pentru scenă. Nimic din planul tău nu e netestat.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"rezultat\" data-pin=\"story\" class=\"pin-o\" style=\"height: 2700px; background: #0E0F11\">\n<div class=\"pin-i\">\n<div style=\"max-width: 1360px; height: 100%; margin: 0 auto; padding: clamp(56px,6vw,88px) clamp(20px,4vw,56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(460px,100%),1fr)); gap: clamp(32px,5vw,80px); align-items: center\">\n<div>\n<p class=\"lb\" style=\"margin: 0 0 32px; color: #B9B3A8\">02 — Studiu de caz · Mădălin<\u002Fp>\n<p class=\"sf\" style=\"margin: 0; font-size: clamp(110px,16vw,240px); line-height: .85; font-weight: 600; letter-spacing: -.03em; font-variant-numeric: tabular-nums\">{{sv.n}}<span style=\"font-size: .2em; letter-spacing: 0; margin-left: 10px; color: #B9B3A8\">kg<\u002Fspan><\u002Fp>\n<div style=\"position: relative; margin-top: 40px; min-height: 150px\">\n<div style=\"position: absolute; inset: 0; opacity: {{sv.o1}}; transform: translateY({{sv.t1}}px)\"><p class=\"lb\" style=\"margin: 0 0 12px; color: #D2AE6D\">Săptămâna 1<\u002Fp><p class=\"sf\" style=\"margin: 0; font-size: clamp(24px,2.4vw,34px); line-height: 1.25; font-weight: 500; max-width: 520px\">81 kg. Trei schimburi a câte opt ore. Mese la ore pe care nu le alege el.<\u002Fp><\u002Fdiv>\n<div style=\"position: absolute; inset: 0; opacity: {{sv.o2}}; transform: translateY({{sv.t2}}px)\"><p class=\"lb\" style=\"margin: 0 0 12px; color: #D2AE6D\">Lunile 1–3<\u002Fp><p class=\"sf\" style=\"margin: 0; font-size: clamp(24px,2.4vw,34px); line-height: 1.25; font-weight: 500; max-width: 520px\">Planul s-a mutat odată cu turele. Când se schimba programul, se schimba și planul.<\u002Fp><\u002Fdiv>\n<div style=\"position: absolute; inset: 0; opacity: {{sv.o3}}; transform: translateY({{sv.t3}}px)\"><p class=\"lb\" style=\"margin: 0 0 12px; color: #D2AE6D\">Luna 4<\u002Fp><p class=\"sf\" style=\"margin: 0; font-size: clamp(24px,2.4vw,34px); line-height: 1.25; font-weight: 500; max-width: 520px\">73 kg. Definirea, încheiată. De aici începe construcția.<\u002Fp><\u002Fdiv>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"display: flex; gap: 8px; margin-top: 28px; max-width: 220px\"><span style=\"flex: 1; height: 2px; background: #2C2D30; position: relative\"><span style=\"position: absolute; inset: 0; background: #D2AE6D; transform-origin: left; transform: scaleX({{sv.b1}})\"><\u002Fspan><\u002Fspan><span style=\"flex: 1; height: 2px; background: #2C2D30; position: relative\"><span style=\"position: absolute; inset: 0; background: #D2AE6D; transform-origin: left; transform: scaleX({{sv.b2}})\"><\u002Fspan><\u002Fspan><span style=\"flex: 1; height: 2px; background: #2C2D30; position: relative\"><span style=\"position: absolute; inset: 0; background: #D2AE6D; transform-origin: left; transform: scaleX({{sv.b3}})\"><\u002Fspan><\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<div>\n<svg sc-camel-view-box=\"0 0 600 420\" width=\"100%\" role=\"img\" aria-label=\"Evoluția greutății lui Mădălin, de la 81 la 73 de kilograme în aproximativ patru luni\" style=\"display: block; overflow: visible\">\n<line x1=\"0\" y1=\"400\" x2=\"600\" y2=\"400\" stroke=\"#2C2D30\"><\u002Fline><line x1=\"0\" y1=\"40\" x2=\"0\" y2=\"400\" stroke=\"#2C2D30\"><\u002Fline>\n<text x=\"10\" y=\"58\" font-family=\"Plus Jakarta Sans\" font-size=\"12\" letter-spacing=\"2\" fill=\"#7E786E\">81 KG<\u002Ftext><text x=\"590\" y=\"352\" text-anchor=\"end\" font-family=\"Plus Jakarta Sans\" font-size=\"12\" letter-spacing=\"2\" fill=\"#7E786E\">73 KG<\u002Ftext>\n<path data-path=\"1\" d=\"M0 70 C 90 80, 140 120, 210 170 S 340 250, 420 300 S 540 335, 600 340\" fill=\"none\" stroke=\"#D2AE6D\" stroke-width=\"2\" sc-camel-path-length=\"1000\" stroke-dasharray=\"1000\" stroke-dashoffset=\"{{sv.dash}}\"><\u002Fpath>\n<circle cx=\"{{sv.x}}\" cy=\"{{sv.y}}\" r=\"18\" fill=\"#D2AE6D\" opacity=\".14\"><\u002Fcircle><circle cx=\"{{sv.x}}\" cy=\"{{sv.y}}\" r=\"6\" fill=\"#D2AE6D\"><\u002Fcircle>\n<\u002Fsvg>\n<p style=\"margin: 20px 0 0; font-size: 12px; line-height: 1.6; color: #7E786E; max-width: 520px\">Valori reale la capete (81 → 73 kg, aproximativ 4 luni); traseul dintre ele este ilustrativ. Rezultat individual: progresul depinde de punctul de plecare, de consecvență și de stilul de viață.<\u002Fp>\n<blockquote class=\"sf\" style=\"margin: 32px 0 0; padding: 0 0 0 0; font-size: 20px; line-height: 1.5; font-style: normal; font-weight: 500; color: #C9C3B8; max-width: 520px\">„A demonstrat că, dacă vrei, se poate, chiar dacă nu ai condițiile ideale.”<footer class=\"lb\" style=\"margin-top: 14px; font-family: 'Plus Jakarta Sans', sans-serif; font-style: normal; font-size: 10px; color: #7E786E\">Aurelian, despre Mădălin<\u002Ffooter><\u002Fblockquote>\n<\u002Fdiv>\n<\u002Fdiv>\n<div aria-hidden=\"true\" style=\"position: absolute; left: 0; bottom: 0; height: 1px; background: #D2AE6D; width: {{sv.w}}%\"><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"program\" data-pin=\"hz\" class=\"pin-o\" style=\"height: 2600px; background: #121316; border-top: 1px solid #1F2023\">\n<div class=\"pin-i\" style=\"display: flex; flex-direction: column; justify-content: center\">\n<div style=\"max-width: 1360px; width: 100%; margin: 0 auto; padding: 0 clamp(20px,4vw,56px) 48px; display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 24px\">\n<div><p class=\"lb\" style=\"margin: 0 0 28px; color: #B9B3A8\">03 — Programul<\u002Fp><h2 class=\"sf\" style=\"margin: 0; font-size: clamp(40px,5.4vw,84px); line-height: .98; font-weight: 500; letter-spacing: -.03em\">Șase piese.<br><em style=\"color: #D2AE6D\">Un singur sistem.<\u002Fem><\u002Fh2><\u002Fdiv>\n<p style=\"margin: 0; max-width: 360px; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Nu plătești separat pentru suport, ajustări sau răspunsuri. Totul face parte din același program, de la primul plan până la ultimul check-in.<\u002Fp>\n<\u002Fdiv>\n<div style=\"padding-left: max(clamp(20px,4vw,56px), calc((100vw - 1360px)/2 + 56px))\">\n<div class=\"trk\" data-trk=\"1\" style=\"padding-right: clamp(20px,4vw,56px)\">\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">01<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Antrenament<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Scris pe zilele în care chiar ajungi la sală. Fiecare exercițiu are un motiv să fie acolo, fiecare săptămână are o progresie.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">02<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Nutriție<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Cifre exacte, farfurii obișnuite. Caloriile și macronutrienții se calculează pe ce mănânci deja, nu pe o listă de cumpărături nouă.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">03<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Check-in săptămânal<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Greutate, poze, feedback. Le citesc pe toate și răspund cu ajustări concrete, nu cu încurajări generice.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">04<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Acces direct<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Ești la sală și nu știi cu ce să înlocuiești un exercițiu? Scrii pe WhatsApp. Îți răspund eu, nu un asistent.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">05<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Faze, nu diete<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Definire, recompoziție, masă musculară. Treci la faza următoare când corpul e pregătit, nu când se termină luna.<\u002Fp><\u002Fdiv><\u002Farticle>\n<article class=\"pn spot\" data-spot=\"1\" style=\"flex: 0 0 min(440px,82vw); min-height: 400px; padding: 40px; border: 1px solid #2A2B2F; display: flex; flex-direction: column; justify-content: space-between\"><span class=\"pnum sf\" style=\"font-size: 72px; font-style: normal; font-weight: 500; color: #4A463F; transition: color .4s\">06<\u002Fspan><div><h3 class=\"sf\" style=\"margin: 0 0 14px; font-size: 32px; font-weight: 500\">Suplimente, doar unde ajută<\u002Fh3><p style=\"margin: 0; font-size: 16px; line-height: 1.7; color: #B9B3A8\">Doar acolo unde au un rost dovedit. Programul funcționează la fel de bine și fără ele.<\u002Fp><\u002Fdiv><\u002Farticle>\n<\u002Fdiv>\n<\u002Fdiv>\n<div class=\"hm\" style=\"max-width: 1360px; width: 100%; margin: 40px auto 0; padding: 0 clamp(20px,4vw,56px); display: flex; align-items: center; gap: 20px\"><span class=\"lb\" style=\"font-size: 10px; color: #7E786E\">01<\u002Fspan><span style=\"flex: 1; height: 1px; background: #2A2B2F; position: relative\"><span style=\"position: absolute; left: 0; top: 0; height: 1px; background: #D2AE6D; width: {{hp}}%\"><\u002Fspan><\u002Fspan><span class=\"lb\" style=\"font-size: 10px; color: #7E786E\">06<\u002Fspan><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section id=\"despre\" data-rv=\"ab\" class=\"{{rv.ab}}\" style=\"background: #EFEBE3; color: #0E0F11\">\n<div style=\"max-width: 1360px; margin: 0 auto; padding: clamp(96px,12vw,184px) clamp(20px,4vw,56px); display: grid; grid-template-columns: repeat(auto-fit, minmax(min(440px,100%),1fr)); gap: clamp(48px,7vw,120px); align-items: start\">\n<div class=\"img\" style=\"aspect-ratio: 3/4; position: sticky; top: 112px\"><i style=\"background: radial-gradient(110% 80% at 30% 20%,#DCD5C7 0%,#C7BFAF 70%)\"><\u002Fi><span class=\"lb\" style=\"position: absolute; left: 22px; bottom: 22px; color: #6B665C; font-size: 10px\">[Portret Aurelian, lumină naturală]<\u002Fspan><\u002Fdiv>\n<div>\n<p class=\"lb fu\" style=\"--d: 0s; margin: 0 0 40px; color: #6B665C\">04 — Despre<\u002Fp>\n<h2 class=\"sf\" style=\"margin: 0; font-size: clamp(40px,5vw,80px); line-height: .98; font-weight: 500; letter-spacing: -.03em\">\n<span class=\"m\" style=\"--i: 0\"><span>Am învățat disciplina<\u002Fspan><\u002Fspan>\n<span class=\"m\" style=\"--i: 1\"><span>într-o academie milita pan><\u002Fsummary><p style=\"margin: 0 0 28px; font-size: 16px; line-height: 1.75; color: #3A3732\">Depinde de punctul de plecare și de consecvență. Primele schimbări apar de regulă în câteva săptămâni; transformările mari vin în câteva luni.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #CFC8BA\"><summary style=\"display: flex; justify-content: space-between; gap: 24px; padding: 28px 0\"><span class=\"sf\" style=\"font-size: 22px; font-weight: 500\">Sunt obligatorii suplimentele?<\u002Fspan><span class=\"pl sf\" aria-hidden=\"true\" style=\"font-size: 30px; font-weight: 500; line-height: 1\">+<\u002Fspan><\u002Fsummary><p style=\"margin: 0 0 28px; font-size: 16px; line-height: 1.75; color: #3A3732\">Nu. Le recomand doar acolo unde chiar ajută. Programul funcționează și fără ele.<\u002Fp><\u002Fdetails>\n<details style=\"border-bottom: 1px solid #CFC8BA\"><summary style=\"display: flex; justify-content: space-between; gap: 24px; padding: 28px 0\"><span class=\"sf\" style=\"font-size: 22px; font-weight: 500\">Cum se face plata?<\u002Fspan><span class=\"pl sf\" aria-hidden=\"true\" style=\"font-size: 30px; font-weight: 500; line-height: 1\">+<\u002Fspan><\u002Fsummary><p style=\"margin: 0 0 28px; font-size: 16px; line-height: 1.75; color: #3A3732\">[Metoda de plată și condițiile, de completat.]<\u002Fp><\u002Fdetails>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsection>\n\n<section data-rv=\"fn\" class=\"{{rv.fn}}\" style=\"max-width: 1360px; margin: 0 auto; padding: clamp(112px,15vw,224px) clamp(20px,4vw,56px); text-align: center\">\n<h2 data-fin=\"1\" class=\"sf\" style=\"margin: 0 auto; max-width: 1200px; will-change: transform; font-size: clamp(48px,8.4vw,144px); line-height: .9; font-weight: 500; letter-spacing: -.03em\"><span class=\"m\" style=\"--i: 0\"><span>Săptămâna unu<\u002Fspan><\u002Fspan><span class=\"m\" style=\"--i: 1\"><span><em style=\"color: #D2AE6D\">poate fi săptămâna asta.<\u002Fem><\u002Fspan><\u002Fspan><\u002Fh2>\n<div class=\"fu\
